<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Saturday Themes is a premium web studio crafting immersive, story-driven websites for brands that refuse to blend in."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300;400;500&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=Inter+Tight:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <title>Saturday Themes® — Websites Worth the Weekend</title>
    <script>
      /* Set the theme class before first paint so the page never flashes the
         wrong background. V2 (paper) is the default; ?v=1 opts into V1 (dark). */
      document.documentElement.classList.add(
        new URLSearchParams(location.search).get('v') === '1' ? 'v1' : 'v2'
      )
    </script>
    <style>
      html.v2,
      html.v2 body {
        background: #f2efe9;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
